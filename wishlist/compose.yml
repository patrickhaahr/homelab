services:
  wishlist:
    image: ghcr.io/cmintey/wishlist:latest
    container_name: wishlist
    restart: unless-stopped
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./data:/usr/src/app/data
    environment:
      ORIGIN: ${ORIGIN}
      TOKEN_TIME: 72
    networks:
      - caddy

networks:
  caddy:
    external: true
